    <line x1="180" y1="720" x2="620" y2="720"/>
    <rect x="250" y="280" width="300" height="440" rx="4"/>
    <rect x="232" y="258" width="336" height="26" rx="3"/>
    <line x1="330" y1="296" x2="330" y2="700"/>
    <line x1="410" y1="296" x2="410" y2="700"/>
    <line x1="490" y1="296" x2="490" y2="700"/>
    <line x1="266" y1="376" x2="534" y2="376"/>
    <line x1="266" y1="472" x2="534" y2="472"/>
    <line x1="266" y1="568" x2="534" y2="568"/>
    <rect x="352" y="312" width="36" height="46" rx="2"/>
    <rect x="412" y="312" width="36" height="46" rx="2"/>
    <rect x="352" y="408" width="36" height="46" rx="2"/>
    <rect x="412" y="408" width="36" height="46" rx="2"/>
    <rect x="352" y="504" width="36" height="46" rx="2"/>
    <rect x="412" y="504" width="36" height="46" rx="2"/>
    <rect x="376" y="632" width="48" height="68" rx="3"/>
