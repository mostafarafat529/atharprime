<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="صورة مؤقتة لقسم من نحن — سيتم استبدالها بصورة حقيقية لاحقًا">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04101f"/>
      <stop offset="0.55" stop-color="#071a33"/>
      <stop offset="1" stop-color="#0a2e52"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#1060a0" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1060a0"/>
      <stop offset="1" stop-color="#70c0f0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>

  <ellipse cx="400" cy="480" rx="260" ry="300" fill="#1060a0" opacity="0.12"/>

