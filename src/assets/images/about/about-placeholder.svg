  <g font-family="Cairo, Almarai, sans-serif" text-anchor="middle">
    <text x="400" y="820" fill="#acd8f5" font-size="34" font-weight="700">صورة المشروع</text>
    <text x="400" y="866" fill="#acd8f5" font-size="20" opacity="0.65">سيتم استبدالها بصورة حقيقية لاحقًا</text>
    <text x="400" y="930" fill="#1060a0" font-size="18" letter-spacing="4">A T H A R   P R I M E</text>
